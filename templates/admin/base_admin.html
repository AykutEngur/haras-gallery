{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block content %}
<section class="section">
  <div class="container admin-layout">
    <aside class="admin-side">
      <p class="eyebrow">Admin</p>
      {% set ep = request.endpoint or '' %}
      <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if ep == 'admin_dashboard' }}">Dashboard</a>
      <a href="{{ url_for('admin_drawings') }}" class="{{ 'active' if 'drawing' in ep }}">Drawings</a>
      <a href="{{ url_for('admin_orders') }}" class="{{ 'active' if 'order' in ep }}">Orders</a>
      <form method="post" action="{{ url_for('admin_logout') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="link-btn">Log out</button>
      </form>
    </aside>
    <div class="admin-main">{% block admin %}{% endblock %}</div>
  </div>
</section>
{% endblock %}
