{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if drawing else 'Add' }} Drawing · Admin{% endblock %}
{% block admin %}
<a href="{{ url_for('admin_drawings') }}" class="link-back">&larr; All drawings</a>
<h1>{{ 'Edit “' ~ drawing.name ~ '”' if drawing else 'Add a drawing' }}</h1>
<form method="post" enctype="multipart/form-data" class="form card-form">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Name
    <input type="text" name="name" required maxlength="150"
           value="{{ form.name if form else (drawing.name if drawing else '') }}">
  </label>
  <label>Published date
    <input type="date" name="published_date"
           value="{{ form.published_date if form else (drawing.published_date.isoformat() if drawing else '') }}">
  </label>
  <label>Description
    <textarea name="description" rows="6">{{ form.description if form else (drawing.description if drawing else '') }}</textarea>
  </label>
  <label>Picture {% if drawing %}<span class="muted">(leave empty to keep the current one)</span>{% endif %}
    <input type="file" name="picture" accept="image/png,image/jpeg,image/webp,image/gif" data-preview="#pic-preview" {{ '' if drawing else 'required' }}>
  </label>
  <img id="pic-preview" class="preview" alt=""
       src="{{ url_for('static', filename='uploads/' ~ drawing.picture) if drawing else '' }}"
       {{ '' if drawing else 'hidden' }}>
  <button class="btn">Save drawing</button>
</form>
{% endblock %}
